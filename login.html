<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14305a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Login | RentSafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/auth.js"></script>
</head>
<body class="pub">
<main class="auth">
  <section class="card" aria-labelledby="title">
    <a class="back" href="index.html">&larr; Back</a>
    <img class="card__logo" src="assets/logo.png" alt="RentSafe logo" width="386" height="267">
    <h1 id="title">Log in to your account</h1>
    <div class="alert" id="formError" role="alert" hidden>Incorrect username or password.</div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="username">Email / Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Enter your username"><p class="error" id="usernameError"></p></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button type="button" class="toggle" id="togglePw" aria-label="Show or hide password">Show</button></div>
        <p class="error" id="passwordError"></p></div>
      <div class="row"><label class="remember"><input type="checkbox" id="remember"> Remember me</label><a class="link" href="#" onclick="alert('Please contact your administrator to reset your password.');return false">Forgot password?</a></div>
      <button type="submit" class="btn block" id="submitBtn"><span>Login</span><span class="spinner" aria-hidden="true"></span></button>
    </form>
    <p class="hint"><b>Demo accounts</b><br>Admin: admin / admin123<br>Renter: renter / renter123</p>
  </section>
</main>
</body>
</html>
